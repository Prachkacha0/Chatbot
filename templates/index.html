<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css?v=13" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button
          id="sidebar-toggle"
          class="icon-button"
          type="button"
          aria-label="ซ่อน/แสดงแถบข้าง"
          aria-controls="sidebar"
          aria-expanded="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <h1 class="brand"><span class="brand-star" aria-hidden="true">✦</span>Polaris</h1>
        <button id="topbar-new-chat" class="icon-button topbar-new-chat" type="button" aria-label="แชทใหม่" title="แชทใหม่">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด">
          <span class="theme-icon-light">☀️</span>
          <span class="theme-icon-dark">🌙</span>
        </button>
      </header>

      <div class="layout">
        <aside id="sidebar" class="sidebar" aria-label="ประวัติแชท">
          <button id="new-chat-btn" class="new-chat-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            แชทใหม่
          </button>
          <nav id="chat-history" class="chat-history" aria-label="แชทที่ผ่านมา"></nav>
          <p class="sidebar-about">
            ประวัติแชทเก็บไว้ในเบราว์เซอร์นี้เท่านั้น สูงสุด 20 แชท
          </p>
        </aside>
        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

        <main class="chat-card">
          <div class="chat-head">
            <h2 id="chat-title" class="chat-title">แชทใหม่</h2>
          </div>

          <section id="chat-log" class="chat-log" aria-live="polite"></section>

          <form id="chat-form" class="composer">
            <div id="chapter-popover" class="chapter-popover" role="dialog" aria-labelledby="chapter-heading" hidden>
              <h3 id="chapter-heading" class="chapter-heading">เนื้อหาในตำรา</h3>
              <p class="chapter-hint">เลือกบทเพื่อใส่คำถามตัวอย่าง</p>
              <div class="chapter-list">
                <button type="button" class="chapter-item" data-question="ประวัติคอมพิวเตอร์เป็นมาอย่างไร"><span class="chapter-num">1</span><span>ประวัติคอมพิวเตอร์</span></button>
                <button type="button" class="chapter-item" data-question="องค์ประกอบของระบบคอมพิวเตอร์มีอะไรบ้าง"><span class="chapter-num">2</span><span>พื้นฐานคอมพิวเตอร์</span></button>
                <button type="button" class="chapter-item" data-question="RAM กับ ROM ต่างกันอย่างไร"><span class="chapter-num">3</span><span>อุปกรณ์คอมพิวเตอร์</span></button>
                <button type="button" class="chapter-item" data-question="เทคโนโลยีสารสนเทศคืออะไร"><span class="chapter-num">4</span><span>เทคโนโลยีสารสนเทศ</span></button>
                <button type="button" class="chapter-item" data-question="องค์ประกอบของการสื่อสารข้อมูลมีอะไรบ้าง"><span class="chapter-num">5</span><span>การสื่อสารข้อมูล</span></button>
                <button type="button" class="chapter-item" data-question="ลอจิกเกต AND ทำงานอย่างไร"><span class="chapter-num">6</span><span>หลักการดิจิทัล</span></button>
                <button type="button" class="chapter-item" data-question="รหัส BCD คืออะไร"><span class="chapter-num">7</span><span>การเข้ารหัส</span></button>
                <button type="button" class="chapter-item" data-question="Big Data คืออะไร"><span class="chapter-num">8</span><span>Big Data</span></button>
              </div>
            </div>
            <div class="composer-pill">
              <button
                id="chapter-btn"
                class="icon-button chapter-button"
                type="button"
                aria-label="สารบัญตำรา"
                title="สารบัญตำรา"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="chapter-popover"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5" /></svg>
              </button>
              <label for="message-input" class="sr-only">คำถาม</label>
              <textarea
                id="message-input"
                rows="1"
                maxlength="4000"
                placeholder="พิมพ์คำถาม เช่น รหัส BCD คืออะไร"
                required
              ></textarea>
              <button id="send-btn" class="send-button" type="submit" aria-label="ส่ง">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <template id="message-template">
      <article class="message">
        <div class="bubble"></div>
        <div class="answer-images"></div>
        <div class="meta"></div>
        <details class="sources">
          <summary class="sources-summary"></summary>
          <div class="sources-list"></div>
        </details>
      </article>
    </template>

    <div id="image-lightbox" class="image-lightbox" hidden>
      <button type="button" class="image-lightbox-close" aria-label="ปิด">&times;</button>
      <img class="image-lightbox-img" alt="" />
      <p class="image-lightbox-caption"></p>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
      integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
      integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
      crossorigin="anonymous"
    ></script>
    <script src="/static/app.js?v=9" defer></script>
  </body>
</html>
