services:
  - type: web
    # Must match the live Render service's name: the Blueprint matches services
    # by name, and a different name makes it create a second service.
    name: chatbot-research
    plan: free
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GROUNDED_PROVIDER
        value: typhoon
      - key: CONVERSATION_PROVIDER
        value: typhoon
      - key: TYPHOON_MODEL
        value: typhoon-v2.5-30b-a3b-instruct
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: TOP_K
        value: "5"
      - key: MIN_RELEVANCE
        value: "0.06"
      - key: TYPHOON_BASE_URL
        value: https://api.opentyphoon.ai/v1
      - key: TYPHOON_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
