# =============================================================
#  Streamlit configuration
#  CRITICAL: the app is pinned to PORT 5001 here so a plain
#  `streamlit run app.py` always serves on http://localhost:5001
# =============================================================

[server]
port = 5001
address = "0.0.0.0"
headless = true
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

# ---- Pure Dark Mode theme (deep near-black background) -------
[theme]
base = "dark"
primaryColor = "#4F9DFF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"
